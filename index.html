<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8番出口 - 完全再現版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 40px;
            border-radius: 12px;
            border: 2px solid #555;
            z-index: 100;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            width: 85%;
            max-width: 420px;
            backdrop-filter: blur(5px);
        }
        #instructions h1 {
            margin-top: 0;
            color: #ff4444;
            font-size: 32px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,68,68,0.5);
        }
        #instructions p {
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
            text-align: left;
            margin: 20px 0;
        }
        #start-btn {
            background: #cc2222;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(204,34,34,0.4);
            transition: background 0.2s, transform 0.1s;
        }
        #start-btn:active {
            transform: scale(0.97);
            background: #e62e2e;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ccc;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #333;
            z-index: 10;
            display: none;
        }
        #message {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            z-index: 10;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: none;
            pointer-events: none;
        }
        #vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.95);
            pointer-events: none;
            z-index: 5;
        }

        /* スマホ用タッチパッドエリア */
        #touch-move-area {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 20;
            display: none;
            touch-action: none;
        }
        #touch-stick {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
        }
        #touch-look-area {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            z-index: 15;
            display: none;
        }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>8番出口</h1>
        <p>
            <b>[ルール]</b><br>
            ・異変を見つけたら<b>引き返せ</b>。<br>
            ・異変がなければ<b>そのまま進め</b>。<br>
            ・無事に8番出口へたどり着け。<br><br>
            <b>[操作方法]</b><br>
            ・<b>PC:</b> WASD移動 / マウス視点<br>
            ・<b>スマホ:</b> 左パッド移動 / 右スワイプ視点
        </p>
        <button id="start-btn">ゲームスタート</button>
    </div>

    <div id="ui">現在の通路: <span id="counter">0</span> / 8</div>
    <div id="crosshair"></div>
    <div id="message"></div>
    <div id="vignette"></div>

    <div id="touch-move-area">
        <div id="touch-stick"></div>
    </div>
    <div id="touch-look-area"></div>

    <!-- Three.js & PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let currentStep = 0;
        let currentAnomalyType = 0; 
        
        let posterMesh, posterTexture, posterTextCtx;
        let middleMan, ceilingLight, ambientLight;

        const totalStepsToWin = 8;
        
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        const corridorLength = 10;
        let gameStarted = false;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        let moveTouchId = null;
        let moveTouchStartX = 0, moveTouchStartY = 0;
        let touchMoveVector = { x: 0, z: 0 };

        let lookTouchId = null;
        let lookTouchLastX = 0, lookTouchLastY = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0b0b);
            scene.fog = new THREE.FogExp2(0x0b0b0b, 0.06);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            const startBtn = document.getElementById('start-btn');
            const instructions = document.getElementById('instructions');

            startBtn.addEventListener('click', () => {
                instructions.style.display = 'none';
                document.getElementById('ui').style.display = 'block';
                document.getElementById('crosshair').style.display = 'block';
                
                if (isMobile) {
                    document.getElementById('touch-move-area').style.display = 'block';
                    document.getElementById('touch-look-area').style.display = 'block';
                } else {
                    controls.lock();
                }
                gameStarted = true;
            });

            controls.addEventListener('unlock', function () {
                if (currentStep < totalStepsToWin && gameStarted && !isMobile) {
                    instructions.style.display = 'block';
                    instructions.querySelector('h1').innerText = "ポーズ中";
                    instructions.querySelector('p').innerHTML = "<br><span style='color: #ffff55; text-align:center; display:block;'>ボタンを押して再開</span>";
                    startBtn.innerText = "ゲームを再開";
                }
            });

            ambientLight = new THREE.AmbientLight(0xffeedd, 0.35);
            scene.add(ambientLight);

            ceilingLight = new THREE.PointLight(0xfff5e6, 1.0, 15);
            ceilingLight.position.set(0, 2.7, -5);
            ceilingLight.castShadow = true;
            scene.add(ceilingLight);

            createCorridor();
            setupNewStage();

            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);

            if (isMobile) {
                initMobileTouchControls();
            }
        }

        function initMobileTouchControls() {
            const moveArea = document.getElementById('touch-move-area');
            const stick = document.getElementById('touch-stick');
            const lookArea = document.getElementById('touch-look-area');

            moveArea.addEventListener('touchstart', (e) => {
                let touch = e.changedTouches[0];
                moveTouchId = touch.identifier;
                let rect = moveArea.getBoundingClientRect();
                moveTouchStartX = rect.left + rect.width / 2;
                moveTouchStartY = rect.top + rect.height / 2;
                e.preventDefault();
            }, { passive: false });

            moveArea.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === moveTouchId) {
                        let dx = touch.clientX - moveTouchStartX;
                        let dy = touch.clientY - moveTouchStartY;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        let maxDist = 40;
                        
                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }

                        stick.style.transform = `translate(${dx}px, ${dy}px)`;
                        touchMoveVector.x = dx / maxDist;
                        touchMoveVector.z = dy / maxDist;
                    }
                }
                e.preventDefault();
            }, { passive: false });

            const resetMoveTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === moveTouchId) {
                        moveTouchId = null;
                        touchMoveVector.x = 0;
                        touchMoveVector.z = 0;
                        stick.style.transform = `translate(0px, 0px)`;
                    }
                }
            };
            moveArea.addEventListener('touchend', resetMoveTouch);
            moveArea.addEventListener('touchcancel', resetMoveTouch);

            lookArea.addEventListener('touchstart', (e) => {
                let touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lookTouchLastX = touch.clientX;
                lookTouchLastY = touch.clientY;
                e.preventDefault();
            }, { passive: false });

            lookArea.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === lookTouchId) {
                        let dx = touch.clientX - lookTouchLastX;
                        let dy = touch.clientY - lookTouchLastY;
                        lookTouchLastX = touch.clientX;
                        lookTouchLastY = touch.clientY;

                        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
                        euler.setFromQuaternion(camera.quaternion);
                        euler.y -= dx * 0.005;
                        euler.x -= dy * 0.005;
                        euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                        camera.quaternion.setFromEuler(euler);
                    }
                }
                e.preventDefault();
            }, { passive: false });

            const resetLookTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            };
            lookArea.addEventListener('touchend', resetLookTouch);
            lookArea.addEventListener('touchcancel', resetLookTouch);
        }

        function createCorridor() {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.9 });

            for (let i = -6; i <= 2; i++) {
                const zPos = i * corridorLength;
                const group = new THREE.Group();

                const floor = new THREE.Mesh(new THREE.PlaneGeometry(4, corridorLength), floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.set(0, 0, zPos);
                floor.receiveShadow = true;
                group.add(floor);

                const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(4, corridorLength), ceilingMat);
                ceiling.rotation.x = Math.PI / 2;
                ceiling.position.set(0, 3, zPos);
                group.add(ceiling);

                const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(corridorLength, 3), wallMat);
                leftWall.position.set(-2, 1.5, zPos);
                leftWall.rotation.y = Math.PI / 2;
                leftWall.receiveShadow = true;
                group.add(leftWall);

                const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(corridorLength, 3), wallMat);
                rightWall.position.set(2, 1.5, zPos);
                rightWall.rotation.y = -Math.PI / 2;
                rightWall.receiveShadow = true;
                group.add(rightWall);

                const light = new THREE.PointLight(0xfff5e6, 0.6, 8);
                light.position.set(0, 2.7, zPos);
                scene.add(light);

                scene.add(group);
            }

            createPoster();
            createMiddleMan();
        }

        function createPoster() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            posterTextCtx = canvas.getContext('2d');

            drawPosterText("8番出口");

            posterTexture = new THREE.CanvasTexture(canvas);
            const posterMat = new THREE.MeshBasicMaterial({ map: posterTexture });
            const posterGeo = new THREE.PlaneGeometry(1.2, 1.2);
            posterMesh = new THREE.Mesh(posterGeo, posterMat);
            posterMesh.position.set(1.98, 1.6, -4);
            posterMesh.rotation.y = -Math.PI / 2;
            scene.add(posterMesh);
        }

        function drawPosterText(text, isRed = false, isUpsideDown = false) {
            const ctx = posterTextCtx;
            ctx.save();
            ctx.clearRect(0, 0, 256, 256);
            
            ctx.fillStyle = isRed ? "#881111" : "#113355";
            ctx.fillRect(0, 0, 256, 256);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 32px 'Courier New'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            if (isUpsideDown) {
                ctx.translate(128, 128);
                ctx.rotate(Math.PI);
                ctx.translate(-128, -128);
            }

            ctx.fillText(text, 128, 128);
            ctx.restore();
            if (posterTexture) posterTexture.needsUpdate = true;
        }

        function createMiddleMan() {
            const manGroup = new THREE.Group();
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.0, 0.3), bodyMat);
            body.position.set(0, 0.8, 0);
            manGroup.add(body);

            const headMat = new THREE.MeshStandardMaterial({ color: 0xffd1b3 });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), headMat);
            head.position.set(0, 1.45, 0);
            manGroup.add(head);

            manGroup.position.set(0, 0, -8);
            manGroup.visible = false;
            scene.add(manGroup);
            middleMan = manGroup;
        }

        function setupNewStage() {
            if (currentStep === 0) {
                currentAnomalyType = 0;
            } else {
                const rand = Math.random();
                if (rand < 0.35) {
                    currentAnomalyType = Math.floor(Math.random() * 5) + 1;
                } else {
                    currentAnomalyType = 0;
                }
            }

            middleMan.visible = false;
            ceilingLight.color.set(0xfff5e6);
            ambientLight.color.set(0xffeedd);

            switch(currentAnomalyType) {
                case 0:
                    drawPosterText("8番出口");
                    break;
                case 1: 
                    drawPosterText("9番出口");
                    break;
                case 2: 
                    drawPosterText("WARNING", true);
                    break;
                case 3: 
                    drawPosterText("8番出口");
                    middleMan.visible = true;
                    middleMan.position.set(0, 0, -8);
                    break;
                case 4: 
                    drawPosterText("8番出口");
                    ceilingLight.color.set(0xff2222);
                    ambientLight.color.set(0x551111);
                    break;
                case 5: 
                    drawPosterText("8番出口", false, true);
                    break;
            }
        }

        function onKeyDown(e) {
            switch (e.code) {
                case 'ArrowUp':
                case 'KeyW': moveForward = true; break;
                case 'ArrowLeft':
                case 'KeyA': moveLeft = true; break;
                case 'ArrowDown':
                case 'KeyS': moveBackward = true; break;
                case 'ArrowRight':
                case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'ArrowUp':
                case 'KeyW': moveForward = false; break;
                case 'ArrowLeft':
                case 'KeyA': moveLeft = false; break;
                case 'ArrowDown':
                case 'KeyS': moveBackward = false; break;
                case 'ArrowRight':
                case 'KeyD': moveRight = false; break;
            }
        }

        function checkZoneProgress() {
            let z = camera.position.z;

            if (z < -12) {
                let isCorrect = (currentAnomalyType === 0);
                evaluateMove(isCorrect, true);
            } else if (z > 4) {
                let isCorrect = (currentAnomalyType !== 0);
                evaluateMove(isCorrect, false);
            }
        }

        function evaluateMove(isCorrect, isForward) {
            if (isCorrect) {
                currentStep++;
                showNotice(isForward ? "正解... 先へ進みます" : "異変を見つけて引き返した... 正解！", "#5f5");
                
                if (currentStep >= totalStepsToWin) {
                    triggerWin();
                    return;
                }
            } else {
                showNotice(isForward ? "異変を見落とした... 0番出口に戻ります" : "異変はないのに引き返した... 0番出口に戻ります", "#f55");
                currentStep = 0;
            }

            document.getElementById('counter').innerText = currentStep;
            camera.position.z = 0;
            setupNewStage();
        }

        let messageTimer = null;
        function showNotice(text, color) {
            const msg = document.getElementById('message');
            msg.style.color = color;
            msg.innerText = text;
            if (messageTimer) clearTimeout(messageTimer);
            messageTimer = setTimeout(() => {
                msg.innerText = "";
            }, 3000);
        }

        function triggerWin() {
            if (!isMobile) controls.unlock();
            gameStarted = false;
            document.getElementById('ui').style.display = 'none';
            document.getElementById('crosshair').style.display = 'none';
            if (isMobile) {
                document.getElementById('touch-move-area').style.display = 'none';
                document.getElementById('touch-look-area').style.display = 'none';
            }
            
            const ins = document.getElementById('instructions');
            ins.style.display = 'block';
            ins.querySelector('h1').innerText = "ゲームクリア！";
            ins.querySelector('p').innerHTML = "<br><span style='color: #ffff55; font-size: 16px; text-align:center; display:block;'>おめでとうございます！<br>無事に『8番出口』から脱出しました！</span>";
            document.getElementById('start-btn').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                if (isMobile) {
                    if (touchMoveVector.z !== 0 || touchMoveVector.x !== 0) {
                        velocity.z -= touchMoveVector.z * 15.0 * delta;
                        velocity.x -= touchMoveVector.x * 15.0 * delta;
                    }
                } else {
                    direction.z = Number(moveForward) - Number(moveBackward);
                    direction.x = Number(moveRight) - Number(moveLeft);
                    direction.normalize();

                    if (moveForward || moveBackward) velocity.z -= direction.z * 15.0 * delta;
                    if (moveLeft || moveRight) velocity.x -= direction.x * 15.0 * delta;
                }

                if (isMobile) {
                    let euler = new THREE.Euler(0, 0, 0, 'YXZ');
                    euler.setFromQuaternion(camera.quaternion);
                    euler.x = 0;
                    let forwardVector = new THREE.Vector3(0, 0, -1).applyEuler(euler);
                    let sideVector = new THREE.Vector3(1, 0, 0).applyEuler(euler);

                    camera.position.addScaledVector(forwardVector, -velocity.z * delta);
                    camera.position.addScaledVector(sideVector, velocity.x * delta);
                } else {
                    controls.moveRight(-velocity.x * delta);
                    controls.moveForward(-velocity.z * delta);
                }

                if (camera.position.x < -1.7) camera.position.x = -1.7;
                if (camera.position.x > 1.7) camera.position.x = 1.7;
                camera.position.y = 1.6;

                checkZoneProgress();
                prevTime = time;
            } else {
                // ゲーム開始前のホーム画面演出（通路をゆっくり見回すカメラアニメーション）
                let t = Date.now() * 0.0008;
                camera.position.y = 1.6 + Math.sin(t * 2) * 0.01;
                camera.rotation.y = Math.sin(t) * 0.15;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
